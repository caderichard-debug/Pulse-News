services:
  db:
    image: postgres:15
    container_name: news_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: news_backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - api/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_db
    volumes:
      - ./api/app:/app/app
      - ./api/tests:/app/tests

volumes:
  postgres_data:

