services:
  db:
    image: postgres:15
    container_name: db
    networks:
      - pulsenetwork
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: news_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: backend
    container_name: news_backend
    networks:
      - pulsenetwork
    depends_on:
      - db
    links:
      - db:db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/news_db
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests

volumes:
  postgres_data:

networks:
  pulsenetwork:
    driver: bridge