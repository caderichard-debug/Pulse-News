name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Lint with ruff (blocking - syntax errors, undefined names, redefinitions)
        run: |
          pip install ruff
          ruff check backend/ --select E9,F63,F7,F82,F601,F811

      - name: Lint with ruff (style, non-blocking)
        run: ruff check backend/ --select E,F,W --statistics || true

      - name: Run tests
        # Previously this step ended in `|| echo ...`, which hid that test collection was
        # failing and zero tests ran. Failures are now reported honestly; the step stays
        # non-blocking until the remaining stale test modules are brought up to date.
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_db
          OPENAI_API_KEY: sk-test-not-a-real-key
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          pytest tests/ -q -p no:warnings --cov=app --cov-report=xml:../coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Job name kept for branch protection, which may still require
  # "Frontend Tests (Next.js)" from the old pipeline. The frontend is now Vite/TanStack.
  frontend-tests:
    name: Frontend Tests (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities (just warn)

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        if: github.event_name == 'pull_request'  # Only run on PRs where BASE != HEAD
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        continue-on-error: false
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: pulse-backend:test
          # Use cache if available, but don't fail if GitHub cache service has issues
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # All checks passed
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, docker-build]
    if: always()

    steps:
      - name: Check if all jobs passed
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "success" ]] && \
             [[ "${{ needs.frontend-tests.result }}" == "success" ]] && \
             [[ "${{ needs.security-scan.result }}" == "success" ]] && \
             [[ "${{ needs.docker-build.result }}" == "success" ]]; then
            echo "✅ All checks passed! Safe to merge."
            exit 0
          else
            echo "❌ Some checks failed. Review the logs above."
            exit 1
          fi
