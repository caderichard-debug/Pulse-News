databases:
  - name: pulse-db
    databaseName: news_db
    plan: free

services:
  # Backend API Service
  - type: web
    name: pulse-backend
    runtime: docker
    repo: https://github.com/caderichard-debug/Pulse-News
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Enable PR previews
    previews:
      generation: automatic
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: SECRETS_FILE
        value: /etc/secrets/.env
      - key: FRONTEND_URL
        value: https://pulse-frontend-pfrt.onrender.com
      - key: CACHE_BUST
        value: "2025-10-10-v2"
      - key: ENVIRONMENT
        value: production
      - key: IS_PULL_REQUEST
        isPreview: true
      - key: DEBUG
        value: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: MAX_TOKENS_PER_REQUEST
        value: 2000
      - key: BATCH_SIZE
        value: 5
      - key: SCRAPE_INTERVAL_HOURS
        value: 3
      - key: PROCESS_INTERVAL_HOURS
        value: 4
      - key: MAX_ARTICLES_PER_SOURCE
        value: 10
      - key: NEWSLETTER_SEND_HOUR
        value: 7
      - key: MAX_ARTICLES_PER_NEWSLETTER
        value: 5
      - key: MAX_FRAMEWORKS_PER_NEWSLETTER
        value: 3
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: FROM_NAME
        value: Pulse News
      # Secrets are loaded from /etc/secrets/.env (Secret File in Render dashboard)

  # Frontend Static Site
  - type: web
    name: pulse-frontend
    runtime: node
    repo: https://github.com/caderichard-debug/Pulse-News
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    # Enable PR previews
    previews:
      generation: automatic
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://pulse-backend-4h7y.onrender.com
