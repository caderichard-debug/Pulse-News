databases:
  - name: pulse-db
    databaseName: news_db
    plan: free

services:
  # Backend API Service
  - type: web
    name: pulse-backend
    runtime: docker
    repo: https://github.com/caderichard-debug/Pulse-News
    branch: render_setup
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pulse-frontend
          property: host
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: MAX_TOKENS_PER_REQUEST
        value: 2000
      - key: BATCH_SIZE
        value: 5
      - key: SCRAPE_INTERVAL_HOURS
        value: 3
      - key: PROCESS_INTERVAL_HOURS
        value: 4
      - key: MAX_ARTICLES_PER_SOURCE
        value: 10
      - key: NEWSLETTER_SEND_HOUR
        value: 7
      - key: MAX_ARTICLES_PER_NEWSLETTER
        value: 5
      - key: MAX_FRAMEWORKS_PER_NEWSLETTER
        value: 3
      - key: FROM_EMAIL
        value: onboarding@resend.dev
      - key: FROM_NAME
        value: Pulse News
      # These need to be set manually in Render dashboard (secrets)
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false

  # Frontend Static Site
  - type: web
    name: pulse-frontend
    runtime: node
    repo: https://github.com/caderichard-debug/Pulse-News
    branch: render_setup
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: pulse-backend
          property: host
