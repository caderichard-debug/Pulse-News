# Deprecated: Render blueprint retained for historical reference during migration.
# Active production deployment uses Railway backend config and Vercel frontend config.
services:
  # Backend API Service
  - type: web
    name: pulse-backend
    runtime: docker
    repo: https://github.com/caderichard-debug/Pulse-News
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Enable PR previews
    previews:
      generation: manual
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-news-postgres
          property: connectionString
      - key: SECRETS_FILE
        value: /etc/secrets/.env
      - key: BACKEND_URL
        fromService:
          type: web
          name: pulse-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: AUTH_URL
        fromService:
          type: web
          name: pulse-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        value: "https://pulsenews.app"
      - key: DOCUMENTATION_URL
        value: "https://pulse-news.readthedocs.io/en/latest/"
      - key: CACHE_BUST
        value: "2025-10-10-v2"
      - key: ENVIRONMENT
        value: production
      - key: IS_PULL_REQUEST
        generateValue: true
      - key: DEBUG
        value: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: MAX_TOKENS_PER_REQUEST
        value: 2000
      - key: BATCH_SIZE
        value: 5
      - key: SCRAPE_INTERVAL_HOURS
        value: 3
      - key: PROCESS_INTERVAL_HOURS
        value: 4
      - key: MAX_ARTICLES_PER_SOURCE
        value: 10
      - key: NEWSLETTER_SEND_HOUR
        value: 7
      - key: MAX_ARTICLES_PER_NEWSLETTER
        value: 5
      - key: MAX_FRAMEWORKS_PER_NEWSLETTER
        value: 3
      - key: FROM_EMAIL
        value: newsletter@pulsenews.app
      - key: FROM_NAME
        value: Pulse News
      # Secrets are loaded from /etc/secrets/.env (Secret File in Render dashboard)

  # Frontend Static Site (TanStack Start SPA mode)
  - type: web
    name: pulse-frontend
    env: static
    repo: https://github.com/caderichard-debug/Pulse-News
    branch: main
    rootDir: frontend
    # NODE_ENV=production (below) skips devDependencies; vite + vite.config need devDependencies.
    # Use NODE_ENV=development only for `npm ci` — avoids `npm ci --include=dev`, which can segfault in
    # Render's npm wrapper on Node 22. `vite build` still runs with service NODE_ENV=production.
    buildCommand: NODE_ENV=development npm ci && npm run build
    staticPublishPath: dist/client
    plan: free
    # Enable PR previews
    previews:
      generation: manual
    envVars:
      # Node 22 + npm ci --include=dev has segfaulted in Render's npm wrapper; pin LTS for stability.
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          type: web
          name: pulse-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /_shell.html
