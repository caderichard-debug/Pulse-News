<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse News Analyzer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 600px;
      height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading p {
      font-size: 14px;
      color: #666;
    }

    #error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
      background: #fef2f2;
      color: #991b1b;
    }

    #error h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    #error p {
      font-size: 13px;
      margin-bottom: 4px;
    }

    #error .details {
      font-size: 11px;
      color: #dc2626;
      margin-top: 8px;
      padding: 8px;
      background: rgba(220, 38, 38, 0.1);
      border-radius: 4px;
      max-width: 100%;
      word-wrap: break-word;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.loaded {
      display: block;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Pulse Analyzer...</p>
  </div>

  <div id="error">
    <h3>⚠️ Error Loading Extension</h3>
    <p id="errorMessage"></p>
    <div id="errorDetails" class="details"></div>
  </div>

  <iframe id="analysisFrame"></iframe>

  <script src="popup.js"></script>
</body>
</html>
